<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120d19"><meta property="og:title" content="Tres meses juntos"><meta property="og:description" content="Tengo algo para ti."><style>body{margin:0}</style></head><body>
<title>Tres meses juntos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: una escena nocturna a pantalla completa. Escritorio: mensaje a la izquierda, árbol a la derecha.
   Celular: árbol arriba, mensaje abajo. El contador va debajo de la línea del suelo, en una tarjeta de vidrio. */
:root{
  --night:#120d19;
  --plum:#241830;
  --ivory:#f6ede6;
  --ivory-2:rgba(246,237,230,.78);
  --ivory-3:rgba(246,237,230,.54);
  --rose:#f06a8c;
  --gold:#f4c27a;
  --line:rgba(246,237,230,.14);
  --ease:cubic-bezier(.2,.7,.2,1);
  --f-display:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ivory);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.scene{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.scene{
  position:relative;display:flex;flex-direction:column;min-height:100%;overflow:hidden;
  background:
    radial-gradient(70% 60% at 72% 38%,rgba(240,106,140,.11),transparent 70%),
    radial-gradient(120% 90% at 50% 0%,#2f1c3d 0%,var(--plum) 38%,var(--night) 85%);
}
.scene::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(8,5,12,.55) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}

.layout{
  position:relative;z-index:2;flex:1;display:grid;
  padding-left:max(clamp(16px,5vw,72px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(16px,5vw,72px),env(safe-area-inset-right,0px));
  padding-block:12px 20px;
  gap:0 clamp(16px,4vw,64px);
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(300px,1fr) auto auto;
  grid-template-areas:"tree" "copy" "foot";
}
.treebox{grid-area:tree;min-width:0}
.copy{grid-area:copy;min-width:0;align-self:center;max-width:34rem;padding-block:20px 0}
.foot{grid-area:foot;min-width:0}

@media (max-width:859px){
  .copy{padding-block:20px 0}
  .eyebrow{font-size:.64rem}
  .title{font-size:clamp(2.1rem,9.5vw,2.7rem);margin:.4rem 0 .65rem}
  .msg{font-size:.94rem;line-height:1.58}
  .sign{margin-top:.75rem;font-size:1.35rem}
  .foot{margin-top:14px}
  .card{display:block;padding:13px 16px 12px;border-radius:20px}
  .foot-label{margin-bottom:10px;font-size:.6rem}
  .units{flex-wrap:nowrap}
  .unit{flex:1 1 0;padding-left:9px;margin-left:9px}
  .unit:first-child{padding-left:0;margin-left:0}
  .num{font-size:1.6rem}
  .cap{font-size:.62rem;letter-spacing:.04em}
  .tool{height:36px;font-size:.66rem;padding:0 13px}
  .tool.icon{width:36px;padding:0}
  #replay{width:36px;padding:0}
  #replay .rt{display:none}
  #replay .ri{display:block}
  .tools{top:10px}
}
@media (max-width:859px) and (max-height:700px){
  .msg{font-size:.88rem;line-height:1.5}
  .title{font-size:2rem;margin-bottom:.45rem}
  .sign{margin-top:.5rem}
  .num{font-size:1.4rem}
}
@media (min-width:860px) and (max-height:560px){
  .layout{padding-block:20px 16px}
  .treebox{min-height:240px}
  .title{font-size:2.6rem;margin-bottom:.8rem}
  .msg{font-size:.95rem;line-height:1.6}
  .foot{margin-top:12px}
  .card{padding:12px 18px}
}
@media (min-width:860px){
  .layout{
    grid-template-columns:minmax(0,5fr) minmax(0,6fr);
    grid-template-rows:1fr auto;
    grid-template-areas:"copy tree" "foot foot";
    padding-block:56px 40px;
  }
  .treebox{min-height:380px}
  .copy{padding-block:0}
}

.eyebrow{margin:0;font:500 .72rem/1 var(--f-body);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.title{margin:.7rem 0 1.3rem;font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,6vw,4.8rem);line-height:1;letter-spacing:-.015em;text-wrap:balance}
.msg{margin:0;font-size:clamp(1rem,1.45vw,1.14rem);line-height:1.75;color:var(--ivory-2);max-width:32rem}
.sign{margin:1.4rem 0 0;font-family:var(--f-display);font-style:italic;font-size:clamp(1.5rem,2.4vw,1.9rem);color:var(--rose)}
.w{
  display:inline-block;opacity:0;transform:translateY(.55em);filter:blur(8px);
  transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease);
}
.w.on{opacity:1;transform:none;filter:none}

.foot{
  margin-top:20px;opacity:0;transform:translateY(14px);
  transition:opacity 1.2s var(--ease),transform 1.2s var(--ease);
}
.foot.on{opacity:1;transform:none}
.card{
  display:inline-block;max-width:100%;padding:20px 24px 18px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 24px 60px -24px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
}
.foot-label{margin:0 0 14px;font:500 .68rem/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3)}
.units{display:flex;flex-wrap:wrap;gap:12px 0}
.unit{display:flex;flex-direction:column;gap:6px;min-width:0;padding-left:clamp(9px,2.4vw,28px);margin-left:clamp(9px,2.4vw,28px);border-left:1px solid var(--line)}
.unit:first-child{padding-left:0;margin-left:0;border-left:0}
.num{font:300 clamp(1.8rem,3.4vw,2.7rem)/1 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ivory)}
.unit:first-child .num{color:var(--rose)}
.num.tick{animation:roll .55s var(--ease)}
@keyframes roll{from{opacity:0;transform:translateY(45%)}to{opacity:1;transform:none}}
.cap{font-size:.72rem;letter-spacing:.08em;color:var(--ivory-3)}

.tools{
  position:absolute;z-index:3;top:16px;right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;
}
.tool{
  font:500 .72rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ivory-2);background:rgba(246,237,230,.06);border:1px solid var(--line);border-radius:999px;
  height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .9s ease,background .2s ease,color .2s ease;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.tool.on{opacity:1;pointer-events:auto}
.tool:hover{background:rgba(246,237,230,.14);color:var(--ivory)}
.tool:focus-visible,.gate-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.tool.icon{width:40px;padding:0}
.tool .ri{display:none;width:18px;height:18px}
.tool svg{width:18px;height:18px;display:block}
.tool .waves{transition:opacity .2s}
.tool.muted .waves{opacity:0}

.gate{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));
  background:radial-gradient(60% 50% at 50% 44%,#2c1b38 0%,var(--night) 72%);
  transition:opacity 1.6s ease,visibility 1.6s;
}
.gate.out{opacity:0;visibility:hidden;pointer-events:none}
.gate-heart{width:68px;height:68px;filter:drop-shadow(0 0 28px rgba(240,106,140,.6));animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%{transform:scale(1)}}
.gate h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem,6.4vw,3.4rem);line-height:1.05;text-align:center;text-wrap:balance}
.gate-btn{
  font:500 .76rem/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid rgba(246,237,230,.22);border-radius:999px;padding:17px 30px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 40px -16px rgba(240,106,140,.55);
  transition:transform .3s var(--ease),box-shadow .3s ease;
}
.gate-btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 50px -14px rgba(240,106,140,.75)}
.gate-note{margin:-10px 0 0;font-size:.74rem;letter-spacing:.14em;color:var(--ivory-3);text-transform:uppercase}

@media (prefers-reduced-motion:reduce){
  .w,.foot,.tool,.gate{transition:none}
  .gate-heart,.num.tick{animation:none}
}
</style>

<main class="scene" id="scene">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="tools">
    <button class="tool icon" id="sound" type="button" aria-label="Silenciar música">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none"/><g class="waves"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></g><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="opacity:0"/></svg>
    </button>
    <button class="tool" id="replay" type="button" aria-label="Ver de nuevo"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.8h4.8"/></svg><span class="rt">Ver de nuevo</span></button>
  </div>

  <div class="layout">
    <div class="treebox" id="treebox" aria-hidden="true"></div>

    <section class="copy" aria-label="Mensaje">
      <p class="eyebrow" id="t-eyebrow" data-type></p>
      <h1 class="title" id="t-title" data-type></h1>
      <p class="msg" id="t-msg" data-type></p>
      <p class="sign" id="t-sign" data-type></p>
      <p class="sr-only" id="t-sr"></p>
    </section>

    <footer class="foot" id="foot">
      <div class="card">
        <p class="foot-label">Nuestra historia empezó hace</p>
        <div class="units" role="timer">
          <div class="unit"><span class="num" id="n0">0</span><span class="cap" id="k0">meses</span></div>
          <div class="unit"><span class="num" id="n1">0</span><span class="cap" id="k1">días</span></div>
          <div class="unit"><span class="num" id="n2">00</span><span class="cap" id="k2">horas</span></div>
          <div class="unit"><span class="num" id="n3">00</span><span class="cap" id="k3">minutos</span></div>
          <div class="unit"><span class="num" id="n4">00</span><span class="cap" id="k4">segundos</span></div>
        </div>
      </div>
    </footer>
  </div>

  <div class="gate" id="gate">
    <svg class="gate-heart" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb0"/><stop offset="1" stop-color="#e8305f"/></linearGradient></defs><path fill="url(#gh)" d="M32 57C10 41 4 29 4 20.5 4 12.5 10.2 7 17.5 7 24 7 29 10.6 32 16c3-5.4 8-9 14.5-9C53.800 7 60 12.500 60 20.500 60 29 54 41 32 57z"/></svg>
    <h2 id="g-title"></h2>
    <button class="gate-btn" id="start" type="button">Toca para comenzar</button>
    <p class="gate-note">Mejor con sonido</p>
  </div>
</main>

<script>
(function(){
'use strict';

/* ================= Ajustes: cambia solo esta parte ================= */
var CONFIG = {
  nombre:  '',                                   // Ejemplo: 'Valeria'. Vacío = "Para ti."
  desde:   '2026-07-18T00:00:00',                // Fecha en que empezó la relación (año-mes-día)
  gate:    'Tengo algo para ti',                 // Frase de la pantalla de entrada
  eyebrow: 'Tres meses juntos',
  mensaje: 'Tres meses y todavía me sorprendo contigo. Un día cualquiera a tu lado se vuelve un recuerdo que quiero guardar. Gracias por tu risa, por tu paciencia y por quedarte. Todo lo que viene lo quiero vivir contigo.',
  firma:   'Con todo mi amor'
};
/* =================================================================== */

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var scene=document.getElementById('scene'), cv=document.getElementById('c'), ctx=cv.getContext('2d');
var treebox=document.getElementById('treebox'), foot=document.getElementById('foot');
var replay=document.getElementById('replay'), soundBtn=document.getElementById('sound');
var gate=document.getElementById('gate'), startBtn=document.getElementById('start');

/* ---------- Utilidades ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry(20261018);
function clamp(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeOutBack(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}

/* ---------- Línea de tiempo (segundos desde que se toca "comenzar") ---------- */
var T={seedIn:.45,fall:1.2,land:2.0,trunk:2.1,bloom:4.2,slide:6.8,slideEnd:8.6,type:7.8,petals:7.6};

/* ---------- Corazones con volumen (3 niveles de profundidad) ---------- */
// Ordenados de rojo profundo a dorado claro: el color depende de dónde da la luz.
var PALETTE=['#a3173f','#d6284f','#e0306f','#e0449a','#ff4d8d','#f06a8c','#ff7b8a','#ff8a5c','#ffa24a','#ffc75f','#ffe29a','#ffd1dc'];
function rgb(hex){var n=parseInt(hex.slice(1),16);return[n>>16,n>>8&255,n&255];}
function tint(hex,k){var c=rgb(hex);return'rgb('+c.map(function(v){return Math.round(k>=0?v+(255-v)*k:v*(1+k));}).join(',')+')';}
function heartPath(g,cx,cy,w){
  g.beginPath();g.moveTo(cx,cy+w*.95);
  g.bezierCurveTo(cx-w*1.25,cy+w*.1,cx-w*1.1,cy-w*.95,cx,cy-w*.35);
  g.bezierCurveTo(cx+w*1.1,cy-w*.95,cx+w*1.25,cy+w*.1,cx,cy+w*.95);
  g.closePath();
}
// level 0 = fondo (oscuro, sin brillo), 1 = medio, 2 = frente (claro, con brillo)
function makeSprite(hex,level){
  var s=128,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var cx=64,cy=66,w=50;
  var top=[-.34,.12,.34][level],mid=[-.42,-.04,.04][level],bot=[-.6,-.26,-.2][level];
  g.save();g.shadowColor='rgba(40,0,20,'+[.5,.45,.4][level]+')';g.shadowBlur=7;g.shadowOffsetY=2.5;
  g.fillStyle=tint(hex,mid);heartPath(g,cx,cy,w);g.fill();g.restore();
  var gr=g.createLinearGradient(0,cy-w,0,cy+w);
  gr.addColorStop(0,tint(hex,top));gr.addColorStop(.5,tint(hex,mid));gr.addColorStop(1,tint(hex,bot));
  g.fillStyle=gr;heartPath(g,cx,cy,w);g.fill();
  g.save();heartPath(g,cx,cy,w);g.clip();
  if(level>0){
    var hl=g.createRadialGradient(cx-w*.4,cy-w*.5,0,cx-w*.4,cy-w*.5,w*.9);
    hl.addColorStop(0,'rgba(255,255,255,'+[0,.32,.62][level]+')');hl.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=hl;g.fillRect(0,0,s,s);
    var rim=g.createRadialGradient(cx,cy+w*.2,w*.4,cx,cy+w*.2,w*1.25);
    rim.addColorStop(0,'rgba(0,0,0,0)');rim.addColorStop(1,'rgba(60,0,25,'+[0,.28,.34][level]+')');
    g.fillStyle=rim;g.fillRect(0,0,s,s);
  }
  g.restore();
  if(level===2){g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.ellipse(cx-w*.46,cy-w*.5,w*.1,w*.05,-.6,0,6.283);g.fill();}
  g.strokeStyle='rgba(60,0,20,.22)';g.lineWidth=1.5;heartPath(g,cx,cy,w);g.stroke();
  return c;
}
var SPR=[0,1,2].map(function(lv){return PALETTE.map(function(h){return makeSprite(h,lv);});});

/* ---------- Árbol: ramas orgánicas con steering hacia puntos dentro del corazón ---------- */
var CX=-.92,SX=.5,SY=.47;                        // centro y escala de la copa (unidades u, y negativa = arriba)
function heartF(x,y){var a=x*x+y*y-1;return a*a*a-x*x*y*y*y;}
function inHeartK(px,py,k){return heartF(px/(SX*k),(CX-py)/(SY*k))<=0;}
function normAng(a){while(a>Math.PI)a-=6.2832;while(a<-Math.PI)a+=6.2832;return a;}
function randInHeart(cx,cy,r){
  for(var k=0;k<40;k++){var x=cx+(rnd()*2-1)*r,y=cy+(rnd()*2-1)*r;if(inHeartK(x,y,1.0))return{x:x,y:y};}
  return{x:cx*.7,y:CX+(cy-CX)*.7};
}
var BARK=['#2b1824','#34202e','#3f2838','#4c3144','#5b3b50'];
var branches=[],anchors=[];

function makeBranch(o){
  var n=Math.max(5,Math.round(o.len/.036)),pts=[],x=o.x,y=o.y,a=o.ang,ph=rnd()*6.28;
  for(var i=0;i<=n;i++){
    var fr=i/n,w=lerp(o.w0,o.w1,Math.pow(fr,.85));
    if(o.flare)w*=1+1.35*Math.exp(-fr*9);
    pts.push({x:x,y:y,w:w});
    if(i===n)break;
    if(o.target){a+=normAng(Math.atan2(o.target.x-x,-(o.target.y-y))-a)*o.steer;}
    a+=Math.sin(i*.8+ph)*.05+(rnd()-.5)*.08;
    if(o.trunk)a+=Math.cos(fr*3.4)*.018;
    var st=o.len/n;x+=Math.sin(a)*st;y-=Math.cos(a)*st;
    if(o.depth>=2&&i>2&&!inHeartK(x,y,1.1)){pts.push({x:x,y:y,w:o.w1});break;}
  }
  var m=pts.length-1;
  for(var j=0;j<=m;j++){
    var p0=pts[Math.max(0,j-1)],p1=pts[Math.min(m,j+1)],tx=p1.x-p0.x,ty=p1.y-p0.y,L=Math.hypot(tx,ty)||1;
    pts[j].nx=-ty/L;pts[j].ny=tx/L;
  }
  var b={pts:pts,t0:o.t0,dur:.45+o.len*1.7,d:o.depth};
  branches.push(b);
  if(o.depth>=2){for(var q=Math.floor(m*.35);q<=m;q+=2)anchors.push({x:pts[q].x,y:pts[q].y,reach:b.t0+b.dur*q/m,d:o.depth});}
  if(o.spawn!==false&&o.depth>=1&&o.depth<4){
    var cnt=o.depth===1?3:(o.depth===2?(rnd()<.5?2:3):2);
    for(var k=0;k<cnt;k++){
      var idx=clamp(Math.floor(m*(.3+.65*((k+rnd()*.8)/cnt))),2,m);
      var p=pts[idx],pr=pts[idx-1],ang=Math.atan2(p.x-pr.x,-(p.y-pr.y)),side=(k%2?1:-1)*(rnd()<.8?1:-1);
      var tgt=randInHeart(p.x+side*.1,p.y-.06,.23-o.depth*.035);

var AC=null,master=null,bus=null,muted=false,nextT=0,step=0,sched=null;
var CHORDS=[[36,48,55,59,64,67,71],[33,45,52,55,60,64,67],[29,41,48,53,57,60,64],[43,50,55,59,62,64,66]];

  var C=window.AudioContext||window.webkitAudioContext;if(reduce||!C)return;
  try{
    AC=new C();master=AC.createGain();master.gain.value=0;
    var comp=AC.createDynamicsCompressor();
    var len=Math.floor(AC.sampleRate*3.4),ir=AC.createBuffer(2,len,AC.sampleRate);
    for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}

    o.connect(pg);pg.connect(g);o.start(when);o.stop(when+dur+.1);
  });

  var g=AC.createGain();g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(.05,when+2);g.gain.linearRampToValueAtTime(.0001,when+dur);

  if(!AC)return;

/* ---------- Dibujo ---------- */
function base(){ctx.setTransform(dpr,0,0,dpr,0,0);}

  var cs=Math.cos(rot)*sz*d,sn=Math.sin(rot)*sz*d;

var endT=T.type+typeTotal+1;

// Ramas como cintas suaves con luz y sombra laterales
function ribbon(P,ws,off,fill){
  var k=P.length,Lx=[],Ly=[],Rx=[],Ry=[];
  for(var i=0;i<k;i++){
    var p=P[i],h=p.w*u*.5*ws,o=(p.nx*.6-p.ny*.8>0?1:-1)*off*p.w*u;
    var cx=treeX+p.x*u+p.nx*o,cy=groundY+p.y*u+p.ny*o;

  }
  ctx.beginPath();ctx.moveTo(Lx[0],Ly[0]);
  for(i=1;i<k-1;i++)ctx.quadraticCurveTo(Lx[i],Ly[i],(Lx[i]+Lx[i+1])/2,(Ly[i]+Ly[i+1])/2);

  for(i=k-2;i>0;i--)ctx.quadraticCurveTo(Rx[i],Ry[i],(Rx[i]+Rx[i-1])/2,(Ry[i]+Ry[i-1])/2);

function drawBranch(b,t){

  for(i=0;i<=m;i++)P.push(b.pts[i]);
  if(m<n){var a=b.pts[m],c=b.pts[m+1];P.push({x:lerp(a.x,c.x,fr),y:lerp(a.y,c.y,fr),w:lerp(a.w,c.w,fr),nx:a.nx,ny:a.ny});}

  ribbon(P,1,0,BARK[b.d]);

    ribbon(P,.3,.24,'rgba(0,0,0,.30)');                 // lado en sombra
    ribbon(P,.26,-.26,'rgba(244,128,160,.42)');          // luz rosada que viene de la copa

// Hojas

// La copa terminada se guarda en imágenes para moverla con fluidez

function draw(t,dt){

    var f=flies[i];
    if(!reduce){f.x+=f.vx*dt*10;f.y+=f.vy*dt*10;if(f.y<-.02)f.y=1.02;if(f.x<-.02)f.x=1.02;if(f.x>1.02)f.x=-.02;}

    ctx.fillStyle='rgba(244,194,122,'+(a*.22)+')';ctx.beginPath();ctx.arc(f.x*W,f.y*H,f.r*3.6,0,6.283);ctx.fill();
    ctx.fillStyle='rgba(255,226,170,'+a+')';ctx.beginPath();ctx.arc(f.x*W,f.y*H,f.r,0,6.283);ctx.fill();
  }

  var lp=easeOut(clamp((t-.6)/1.6));
  if(lp>0){
    var half=(W/2-W*.03)*lp,x0=W/2-half,x1=W/2+half;

    gl.addColorStop(0,'rgba(246,237,230,0)');gl.addColorStop(.15,'rgba(246,237,230,.28)');gl.addColorStop(.85,'rgba(246,237,230,.28)');gl.addColorStop(1,'rgba(246,237,230,0)');

  }

  var beat=t>endT?Math.pow(Math.max(0,Math.sin((t-endT)*3)),14):0;
  var bp=clamp((t-T.bloom)/3.6);

      sg.addColorStop(0,'rgba(255,92,138,.4)');sg.addColorStop(1,'rgba(255,92,138,0)');
      ctx.fillStyle=sg;ctx.fillRect(startX-ssz*2.4,sy-ssz*2.4,ssz*4.8,ssz*4.8);

  if(bloom&&!cache.ok&&t>cacheT)buildCache(t);

  // 1) hojas del fondo
  if(bloom){
    if(cache.ok)drawCache(cache.far,t,bs);
    else{for(var j=0;j<leavesFar.length;j++)liveLeaf(leavesFar[j],t,false);base();}
  }

  // 2) tronco y ramas
  for(var k=0;k<branches.length;k++)drawBranch(branches[k],t);

  // 3) hojas de frente, brillo y destellos
  if(bloom){
    if(cache.ok){
      drawCache(cache.near,t,bs);
      if(!reduce){for(var q=0;q<leavesFlutter.length;q++)liveLeaf(leavesFlutter[q],t,true);base();}
      var ga=clamp((t-cache.at)/1.2)*.3*(1+.7*beat);
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=ga;
      ctx.drawImage(cache.glow,treeX-.85*u,groundY-1.62*u,1.7*u,1.32*u);
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }else{
      for(var j2=0;j2<leavesNear.length;j2++)liveLeaf(leavesNear[j2],t,false);base();
    }
    if(t>T.bloom+3&&!reduce){
      ctx.globalCompositeOperation='lighter';
      for(var s=0;s<sparks.length;s++){
        var sp=sparks[s],cyc=t*sp.f+sp.o,ph=cyc-Math.floor(cyc),al=Math.sin(ph*Math.PI);al=al*al*al;if(al<.03)continue;
        var idx=(((Math.floor(cyc)*2654435761)+sp.id*40503)>>>0)%leaves.length,ll=leaves[idx];
        var px=treeX+ll.x*u,py=groundY+ll.y*u,rr=u*.011*(.6+al);
        var sg2=ctx.createRadialGradient(px,py,0,px,py,rr*1.8);
        sg2.addColorStop(0,'rgba(255,236,214,'+(al*.45)+')');sg2.addColorStop(1,'rgba(255,236,214,0)');
        ctx.fillStyle=sg2;ctx.fillRect(px-rr*1.8,py-rr*1.8,rr*3.6,rr*3.6);
        ctx.strokeStyle='rgba(255,244,230,'+(al*.6)+')';ctx.lineWidth=1;ctx.beginPath();
        ctx.moveTo(px-rr*2.4,py);ctx.lineTo(px+rr*2.4,py);ctx.moveTo(px,py-rr*2.4);ctx.lineTo(px,py+rr*2.4);ctx.stroke();
      }
      ctx.globalCompositeOperation='source-over';
    }
  }

  if(!reduce){
    if(t>T.petals){nextPetal-=dt;if(nextPetal<=0){spawnPetal();nextPetal=.28+Math.random()*.4;}}
    for(var m=petals.length-1;m>=0;m--){
      var pt=petals[m];
      if(pt.land===0){pt.x+=(pt.vx+Math.sin(t*1.6+pt.ph)*16)*dt;pt.y+=pt.vy*dt;pt.rot+=pt.vr*dt;if(pt.y>=groundY-2){pt.y=groundY-2;pt.land=.001;}}
      else{pt.land+=dt;if(pt.land>4.5){petals.splice(m,1);continue;}}
      spr(ctx,SPR[2][pt.c],pt.x,pt.y,pt.sz,pt.rot,(pt.land?1-clamp(pt.land/4.5):1)*.95,dpr);
    }
    base();
    for(var b=bursts.length-1;b>=0;b--){
      var bu=bursts[b];bu.life+=dt;if(bu.life>bu.max){bursts.splice(b,1);continue;}
      bu.vx*=.985;bu.vy+=60*dt;bu.x+=bu.vx*dt;bu.y+=bu.vy*dt;bu.rot+=bu.vr*dt;
      spr(ctx,SPR[2][bu.c],bu.x,bu.y,bu.sz*(.6+.4*clamp(bu.life/.3)),bu.rot,1-clamp(bu.life/bu.max),dpr);
    }
    base();
  }
}

/* ---------- Cámara: acercamiento suave y parallax ---------- */
var camX=0,camY=0,tx=0,ty=0;
function camera(t){
  var s=1.035+.085*(1-easeOut(clamp(t/12)));
  camX+=(tx-camX)*.06;camY+=(ty-camY)*.06;
  cv.style.transformOrigin=treeX+'px '+(groundY-.7*u)+'px';
  cv.style.transform='translate3d('+camX.toFixed(2)+'px,'+camY.toFixed(2)+'px,0) scale('+s.toFixed(4)+')';
}

/* ---------- Bucle ---------- */
var t=0,last=0,lastSec=-1,replayShown=false,started=false,lowQ=false,perfN=0,perfSum=0;
function reveal(){
  while(shown<words.length&&times[shown]<=t-T.type){words[shown].classList.add('on');shown++;}
  if(t>=T.type-.2)foot.classList.add('on');
  if(!replayShown&&t>endT+.5){replayShown=true;replay.classList.add('on');}
}
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  if(!lowQ&&t>3){perfN++;perfSum+=dt;if(perfN===90){if(perfSum/90>.034){lowQ=true;dprCap=1.25;layout();}perfN=0;perfSum=0;}}
  var sec=Math.floor(Date.now()/1000);if(sec!==lastSec){lastSec=sec;updateCounter();}
  reveal();draw(t,dt);camera(t);
  requestAnimationFrame(frame);
}
function begin(){
  if(started)return;started=true;
  gate.classList.add('out');
  initAudio();soundBtn.classList.add('on');enableTilt();
  t=0;last=performance.now();requestAnimationFrame(function(n){last=n;frame(n);});
}
function finalState(){
  for(var i=0;i<words.length;i++)words[i].classList.add('on');
  shown=words.length;foot.classList.add('on');gate.classList.add('out');
  t=1000;layout();draw(t,0);cv.style.transform='scale(1.035)';
}

layout();updateCounter();
if(reduce){finalState();setInterval(updateCounter,1000);}
else{
  startBtn.addEventListener('click',function(e){e.stopPropagation();begin();});
  gate.addEventListener('click',begin);
}

/* ---------- Inclinación del celular (parallax) ---------- */
function onTilt(e){if(e.gamma==null)return;tx=-clamp(e.gamma/30,-1,1)*10;ty=-clamp((e.beta-45)/30,-1,1)*6;}
function enableTilt(){
  try{
    if(!window.matchMedia('(pointer:coarse)').matches)return;
    var D=window.DeviceOrientationEvent;
    if(D&&typeof D.requestPermission==='function'){D.requestPermission().then(function(r){if(r==='granted')window.addEventListener('deviceorientation',onTilt);}).catch(function(){});}
    else if(D){window.addEventListener('deviceorientation',onTilt);}
  }catch(e){}
}

/* ---------- Eventos ---------- */
var ro=new ResizeObserver(function(){layout();if(reduce)draw(t,0);});
ro.observe(scene);ro.observe(treebox);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){layout();if(reduce)draw(t,0);});

scene.addEventListener('pointerdown',function(e){
  if(reduce||!started||t<T.land||(e.target.closest&&e.target.closest('button')))return;
  var r=scene.getBoundingClientRect();spawnBurst(e.clientX-r.left,e.clientY-r.top);
});
scene.addEventListener('pointermove',function(e){
  tx=-(e.clientX/window.innerWidth-.5)*14;ty=-(e.clientY/window.innerHeight-.5)*9;
});
replay.addEventListener('click',function(){
  t=0;shown=0;replayShown=false;petals=[];bursts=[];nextPetal=0;
  words.forEach(function(w){w.classList.remove('on');});
  foot.classList.remove('on');replay.classList.remove('on');
});
soundBtn.addEventListener('click',function(){setMuted(!muted);});
})();
</script>
